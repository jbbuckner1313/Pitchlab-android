name: Build PitchLab APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: unzip -o PitchLab-android-source.zip -d project
      - run: echo 'android { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }' >> project/app/build.gradle.kts
      - run: gradle -p project :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PitchLab-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
