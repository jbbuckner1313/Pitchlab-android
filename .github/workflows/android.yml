name: Build PitchLab APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: unzip -o PitchLab-android-source.zip -d project
      - name: Correct source build settings
        run: |
          echo 'android { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }' >> project/app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in Path('project/app/src/main/java/com/example/pitchlab').glob('*.kt'):
              source = path.read_text().replace('rpmOffsets.mapNotNull', 'rpmOffsets.toList().mapNotNull')
              source = re.sub(r'textColor = (android\.graphics\.Color\.[A-Z]+|Color\.[A-Z]+|Color\.rgb\([^)]*\)|accent|muted)', r'setTextColor(\1)', source)
              path.write_text(source)
          PY
      - run: gradle -p project :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PitchLab-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
